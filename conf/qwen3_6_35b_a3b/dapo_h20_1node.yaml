# @package _global_
# Qwen3.6-35B-A3B DAPO on a single 8-GPU H20 node (colocated rollout + training), rollout decode steps of up to 32
# sequences on the libtilert_qwen36 kernels (SGLang --enable-nvidia-megakernel, plugin tilert_sglang).
#
# 1. Image: docker/Dockerfile, built with --build-context tilert=/path/to/tilert-kernels.
# 2. Download the model and dataset:
#      hf download Qwen/Qwen3.6-35B-A3B --local-dir /root/Qwen3.6-35B-A3B
#      hf download Haitao999/DAPO-Math-17k-unique --repo-type=dataset \
#        --local-dir /root/DAPO-Math-17k-unique
# 3. Launch with those paths:
#      bash examples/start.sh qwen3_6_35b_a3b/dapo_h20_1node \
#        hf_model_path=/root/Qwen3.6-35B-A3B \
#        data_source.dataset.prompt_data_path=/root/DAPO-Math-17k-unique
# The whole decoder of those steps runs on tilert.  max_running_requests 32 keeps every decode step within the kernels' 32 rows.
defaults:
  - /default
  - _self_

checkpoint_path: "./checkpoints"
hf_model_path: ???
colocate: true    # must be false in fully-async mode
total_steps: 100

data_source:
  dataset:
    prompt_data_path: "/path/to/prompt-data"
    input_key: prompt
    label_key: reward_model
  reward:
    name: dapo_math
    overlong_penalty_length: 4096
  num_prompts_per_step: 64
  num_trajectories_per_prompt: 8
  max_response_len_per_trajectory: 20480

rollout:
  num_gpus_per_node: 8
  sglang_args:
    mem_fraction_static: 0.8
    disable_cuda_graph: false
    # the tilert spec: one GPU per replica (tp 1), bf16, the triton MoE runner (w13 as [gate | up], unshuffled),
    # decode steps of <= 32 rows (larger batches run SGLang's own forward)
    enable_nvidia_megakernel: true
    moe_runner_backend: triton
    max_running_requests: 32
  sglang_replicas:
    regular:
      num_nodes: 1
      num_gpus_per_replica: 1

agentflow:
  dump_trajectory_path: "log/trajectories"
  tokenizer:
    generation_prompt_kwargs:
      enable_thinking: true

trainer:
  num_gpus_per_node: 8
  num_nodes: 1
  mini_batch_size: 128
  max_tokens_per_gpu: 20480
  use_dynamic_batch_size: true
  use_rollout_routing_replay: true
  use_fp32_lm_head: true

megatron:
  model:
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 2
    virtual_pipeline_model_parallel_size: null
    context_parallel_size: 1
    expert_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    mtp_num_layers: null  
    attention_backend: flash

algorithm:
  advantage_estimator: grpo
  advantage_norm_mode: group_zscore
  policy_loss: grpo
  loss_agg_mode: token-mean
  is_correction:
    enable: true
    action: mask
    level: token
    lower_bound: 0.5
    upper_bound: 2
